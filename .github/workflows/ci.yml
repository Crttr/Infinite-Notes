name: Build checks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  linux-tauri:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Detect Tauri sources
        id: detect
        shell: bash
        run: |
          if [ -f src-tauri/Cargo.toml ] && [ -f src-tauri/tauri.conf.json ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'src-tauri absent: Linux package build skipped' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: steps.detect.outputs.present == 'true'
      - name: Linux Tauri dependencies
        if: steps.detect.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
        if: steps.detect.outputs.present == 'true'
      - name: Build AppImage and DEB
        if: steps.detect.outputs.present == 'true'
        run: npm run tauri -- build --bundles appimage,deb
      - uses: actions/upload-artifact@v4
        if: steps.detect.outputs.present == 'true'
        with:
          name: infinitenotes-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
